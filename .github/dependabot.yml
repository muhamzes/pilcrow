version: 2

updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

    # Grouped so a routine week is one reviewable PR rather than fifteen.
    # Ungrouped updates train reviewers to rubber-stamp, which is how a
    # malicious release gets merged.
    groups:
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]

    # Majors arrive individually — they carry breaking changes and deserve to be
    # read on their own. The ones listed here are suppressed entirely, because a
    # PR that can never go green is noise: it gets reopened on every release and
    # trains us to ignore the dependency list.
    ignore:
      - dependency-name: 'next'
        update-types: [version-update:semver-major]
      - dependency-name: 'react'
        update-types: [version-update:semver-major]
      - dependency-name: 'react-dom'
        update-types: [version-update:semver-major]

      # Both of these are gated by the lint toolchain, not by our code, so the
      # bump cannot succeed until a third party ships support. Each was opened
      # and closed once already (PR #5, PR #4):
      #
      #   typescript 7.x → `typescript-eslint does not support TS 7.0`
      #   eslint 10.x    → eslint-plugin-react's react/display-name rule breaks
      #                    on ESLint 10's changed context API
      #                    (`contextOrFilename.getFilename is not a function`)
      #
      # Minor and patch updates still come through. Remove an entry once
      # typescript-eslint supports TS 7 / eslint-config-next supports ESLint 10.
      - dependency-name: 'typescript'
        update-types: [version-update:semver-major]
      - dependency-name: 'eslint'
        update-types: [version-update:semver-major]

    labels: [dependencies]
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
    labels: [dependencies, ci]
    commit-message:
      prefix: 'chore(ci)'
